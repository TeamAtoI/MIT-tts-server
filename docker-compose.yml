services:
  tts-gpu:
    image: ${TTS_GPU_IMAGE:-ghcr.io/teamatoi/mit-tts:gpu-latest}
    container_name: tts-gpu
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      TTS_USE_GPU: "true"
    gpus: all
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
