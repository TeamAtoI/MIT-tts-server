[project]
name = "supertonic-server"
version = "0.1.0"
description = "Supertonic TTS Server with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=1.24.0,<2.0.0",
    "huggingface-hub>=1.3.2",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.17.0,<1.18.0",  # CUDA 11.8 + cuDNN 8.x (sm70 지원)
    "nvidia-cuda-runtime-cu11>=11.8.0",  # CUDA 11 런타임
    "nvidia-cublas-cu11>=11.11.0",  # cuBLAS
    "nvidia-curand-cu11>=10.3.0",  # cuRAND
    "nvidia-cufft-cu11>=10.9.0",  # cuFFT
    "nvidia-cudnn-cu11>=8.9.0,<9.0.0",  # cuDNN 8.x for CUDA 11 (libcudnn.so.8)
]
cpu = [
    "onnxruntime>=1.18.0",  # CPU 전용 (GPU 환경 없는 경우)
]
