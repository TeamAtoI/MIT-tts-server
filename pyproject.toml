[project]
name = "supertonic-server"
version = "0.1.0"
description = "Supertonic TTS Server with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=1.24.0,<2.0.0",
    "onnxruntime-gpu==1.16.3",  # GPU 버전 (기본, CUDA 11.8 + cuDNN 8.x)
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.18.0",  # CPU 전용 (GPU 환경 없는 경우)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
